name: Sync YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependency
        run: python -m pip install --upgrade yt-dlp

      - name: Update YouTube feed
        run: python scripts/sync_youtube.py

      - name: Commit feed changes
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "No feed changes."
            exit 0
          fi

          git config user.name "ASTREA WATCH Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Sync ASTREA YouTube feed"
          git push
